name: attest
version: 0.5.0
description: "Paper trading ledger for Hermes agents. Orders, balances and P&L live in a SQLite ledger the plugin owns; the agent gets its figures by calling get_portfolio, get_pnl and get_quote instead of stating them. Orders are priced from live public exchange quotes with slippage and a fee, and pass a per-order size limit, a daily loss kill switch and duplicate-order checks first. In paper mode it can also guard one named external order tool, simulating its calls instead of letting them run, and it appends a short note when a reply states a balance or P&L figure the ledger contradicts. No real money, no exchange account, no keys. Network: read-only HTTPS GETs of public ticker data from www.okx.com, then api.kraken.com, then data-api.binance.vision as fallbacks. Nothing else leaves the machine."
requires_hermes: ">=0.23.0"
# Network disclosure (Hermes has no manifest field for this, so it is stated here and in the description).
# Tried in this order; the next host is used only if the previous one fails, times out, or sends a bad or
# stale quote. Each request has a hard 3 second deadline and sends only the trading pair.
#   1. www.okx.com              GET /api/v5/market/ticker?instId=BTC-USDT
#   2. api.kraken.com           GET /0/public/Ticker?pair=XBTUSDT
#   3. data-api.binance.vision  GET /api/v3/ticker/bookTicker?symbol=BTCUSDT
# When: on paper_order and get_quote, and on get_portfolio, get_pnl and /attest status to mark open positions.
tags:
  - paper-trading
  - network
provides_tools:
  - paper_order
  - get_quote
  - get_portfolio
  - get_pnl
provides_hooks:
  - pre_tool_call
  - transform_llm_output
provides_commands:
  - attest
config_schema:
  starting_balance:
    type: number
    default: 10000
    description: "Starting balance in USDT for a new paper account, and the default for /attest reset."
  fee_bps:
    type: number
    default: 10
    description: "Fee per fill in basis points of the notional (10 = 0.1%, a taker fee). 0 to 1000."
  slippage_bps:
    type: number
    default: 5
    description: "Slippage against the trader in basis points (buys above the ask, sells below the bid), never past a limit price. 0 to 1000."
  max_quote_age_seconds:
    type: number
    default: 10
    description: "A quote older than this is stale and is never used to fill or to mark as live. 1 to 300."
  max_order_notional:
    type: number
    default: 1000
    description: "Largest single order in USDT (quantity times the live ask for buys, bid for sells). Larger orders are rejected."
  max_daily_loss:
    type: number
    default: 500
    description: "Daily loss kill switch in USDT. Once equity at live marks falls this much below the day's starting equity (taken at the first order of the UTC day), buys are blocked until the next UTC day or /attest resume."
  dedupe_window_seconds:
    type: number
    default: 10
    description: "An identical order in the same session within this many seconds, without a new client_order_id, is rejected as a likely accidental repeat. 0 turns this off."
  paper_mode:
    type: bool
    default: true
    description: "On: calls to intercept_tool are simulated on the attest ledger and never run. Off: intercept_tool runs for real and attest only watches its own tools."
  intercept_tool:
    type: str
    default: ""
    description: "Name of one external order tool to guard in paper mode, for example demo_broker_order. Empty: none."
  intercept_args:
    type: dict
    default: {}
    description: "Maps attest's order fields (symbol, side, quantity, notional, order_type, limit_price, client_order_id, note) to intercept_tool's argument names; dotted names reach nested arguments. Empty: the tool uses attest's names."
  demo_stub_tool:
    type: bool
    default: false
    description: "Test only. Registers demo_broker_order, a stub that pretends to send a real order, for proving interception. Takes effect after a gateway restart."
